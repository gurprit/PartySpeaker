name: Apply retro hi-fi visuals

on:
  push:
    branches:
      - redesign/retro-hifi
    paths:
      - '.github/workflows/apply-retro-hifi-visuals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign/retro-hifi

      - name: Patch retro hi-fi presentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          playlist = Path('src/components/host/PlaylistPanel.tsx')
          text = playlist.read_text()
          text = text.replace("import TrackInfo from '../visualiser/TrackInfo';", "import TrackInfo from '../visualiser/TrackInfo';\nimport RetroSpectrum from '../visualiser/RetroSpectrum';")
          text = text.replace("      <PartyCard style={localStyles.nowPlayingCard}>\n        <NowPlayingArtwork", "      <PartyCard style={localStyles.nowPlayingCard}>\n        <RetroSpectrum active={playbackState === 'playing'} />\n\n        <NowPlayingArtwork")
          text = text.replace("    backgroundColor: partyTheme.white,\n  },\n  timeText:", "    backgroundColor: partyTheme.accent,\n    shadowColor: partyTheme.accent,\n    shadowOpacity: 0.7,\n    shadowRadius: 6,\n  },\n  timeText:")
          text = text.replace("    color: partyTheme.white,\n    fontSize: 34,", "    color: partyTheme.accentSoft,\n    fontSize: 30,")
          text = text.replace("  playButton: {\n    width: 76,\n    height: 76,\n    borderRadius: 38,\n    backgroundColor: partyTheme.white,", "  playButton: {\n    width: 76,\n    height: 76,\n    borderRadius: 12,\n    backgroundColor: partyTheme.hardwareRaised,\n    borderWidth: 1,\n    borderColor: partyTheme.accent,\n    shadowColor: partyTheme.accent,\n    shadowOpacity: 0.5,\n    shadowRadius: 12,")
          text = text.replace("  playButtonText: {\n    color: partyTheme.black,", "  playButtonText: {\n    color: partyTheme.accent,")
          text = text.replace("  trackRowSelected: {\n    backgroundColor: partyTheme.white,\n  },", "  trackRowSelected: {\n    backgroundColor: partyTheme.cardStrong,\n    borderColor: partyTheme.accent,\n    borderWidth: 1,\n    shadowColor: partyTheme.accent,\n    shadowOpacity: 0.42,\n    shadowRadius: 10,\n    elevation: 5,\n  },")
          text = text.replace("  trackIndexSelected: {\n    color: partyTheme.black,\n  },", "  trackIndexSelected: {\n    color: partyTheme.accent,\n  },")
          text = text.replace("  trackArtworkTextSelected: {\n    color: partyTheme.black,\n  },", "  trackArtworkTextSelected: {\n    color: partyTheme.accent,\n  },")
          text = text.replace("  trackTitleSelected: {\n    color: partyTheme.black,\n  },", "  trackTitleSelected: {\n    color: partyTheme.accentSoft,\n    textShadowColor: partyTheme.accentDim,\n    textShadowRadius: 6,\n  },")
          text = text.replace("  trackMetaSelected: {\n    color: 'rgba(0,0,0,0.55)',\n  },", "  trackMetaSelected: {\n    color: partyTheme.muted,\n  },")
          text = text.replace("  rowActionSelected: {\n    color: 'rgba(0,0,0,0.62)',\n  },", "  rowActionSelected: {\n    color: partyTheme.accentSoft,\n  },")
          text = text.replace("  nowPlayingCard: {\n    padding: 18,\n  },", "  nowPlayingCard: {\n    padding: 18,\n    backgroundColor: partyTheme.lcd,\n    borderColor: partyTheme.accentDim,\n  },")
          playlist.write_text(text)

          app = Path('App.tsx')
          text = app.read_text()
          text = text.replace("            color: partyTheme.white,\n            fontSize: 112,", "            color: partyTheme.accent,\n            fontSize: 112,")
          text = text.replace("            fontWeight: '900',\n            letterSpacing: -6,", "            fontWeight: '900',\n            fontFamily: 'monospace',\n            textShadowColor: partyTheme.accentDim,\n            textShadowRadius: 18,\n            letterSpacing: 4,")
          text = text.replace("          color: partyTheme.white,\n          fontSize: 54,", "          color: partyTheme.accent,\n          fontSize: 54,")
          text = text.replace("          fontWeight: '900',\n          letterSpacing: -2,", "          fontWeight: '900',\n          fontFamily: 'monospace',\n          letterSpacing: -1,")
          text = text.replace("    backgroundColor: '#050505',", "    backgroundColor: partyTheme.bg,")
          app.write_text(text)
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-retro-hifi-visuals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/components/host/PlaylistPanel.tsx .github/workflows/apply-retro-hifi-visuals.yml
          git commit -m "Apply retro hi-fi visual redesign"
          git push origin HEAD:redesign/retro-hifi
