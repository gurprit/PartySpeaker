name: Patch standby nullability

on:
  push:
    branches:
      - redesign/retro-hifi

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign/retro-hifi
          fetch-depth: 0

      - name: Patch unreachable standby guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('App.tsx')
          text = path.read_text()
          old = '    if (false && standbyReadyEverywhere) {'
          new = '    if (Boolean(0) && standbyReadyEverywhere) {'
          if old not in text:
              raise SystemExit('Expected standby guard not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/patch-selected-null.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx .github/workflows/patch-selected-null.yml
          git commit -m "Fix standby nullability type check"
          git push origin HEAD:redesign/retro-hifi
